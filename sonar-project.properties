# Configuración para SonarQube Cloud (la usa el pipeline de GitHub Actions)
# Reemplaza TU-ORGANIZACION por la clave de tu organización en SonarQube Cloud
# y TU-ORGANIZACION_cuidarteplus por la clave del proyecto (Administration > Information).
sonar.organization=TU-ORGANIZACION
sonar.projectKey=TU-ORGANIZACION_cuidarteplus
sonar.projectName=Cuidarte+

sonar.sources=BACKEND/src,FRONTEND/src
sonar.tests=BACKEND/tests,pruebas-e2e/tests
sonar.exclusions=**/node_modules/**,FRONTEND/src/assets/**,BACKEND/src/openapi.json

# Cobertura de las pruebas del backend
sonar.javascript.lcov.reportPaths=BACKEND/coverage/lcov.info

# El frontend se prueba con Playwright (no genera cobertura de código)
sonar.coverage.exclusions=FRONTEND/src/**

sonar.sourceEncoding=UTF-8
