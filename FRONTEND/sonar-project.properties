# An?lisis de SonarQube local - FRONTEND (React)
sonar.projectKey=cuidarteplus-frontend
sonar.projectName=Cuidarte+ - Frontend (React)
sonar.projectVersion=1.0

sonar.sources=src,Dockerfile
sonar.exclusions=**/node_modules/**,src/assets/**
sonar.sourceEncoding=UTF-8
sonar.working.directory=/tmp/.scannerwork

# El frontend se prueba con Playwright (no genera cobertura de codigo): se excluye del calculo
sonar.coverage.exclusions=src/**

