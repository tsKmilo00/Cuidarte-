# Análisis de SonarQube local - BACKEND (API Node.js / Express)
sonar.projectKey=cuidarteplus-backend
sonar.projectName=Cuidarte+ - Backend (API)
sonar.projectVersion=1.0

# Qué se analiza: el código fuente y el Dockerfile
sonar.sources=src,Dockerfile
sonar.exclusions=**/node_modules/**,src/openapi.json

# Dónde están las pruebas y el reporte de cobertura (Actividad 2)
sonar.tests=tests
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

# Carpeta temporal del scanner (dentro del contenedor, para no ensuciar tu carpeta)
sonar.working.directory=/tmp/.scannerwork
